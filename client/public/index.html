<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <!-- `viewport-fit=cover` e o que faz `env(safe-area-inset-*)` valer no iPhone com
         entalhe: sem ele a barra inferior fica debaixo da barra de gestos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Orion - GMP - Sistema de Gestão da GMP Industriais" />

    <!-- PWA ------------------------------------------------------------------
         theme_color combina com o `background_color` do manifest (#10141D, o mesmo
         navy do ícone): a barra de status e a splash de abertura ficam da mesma cor,
         em vez de piscar azul e depois navy. -->
    <meta name="theme-color" content="#10141D" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- O iOS ignora o manifest para o ícone da tela de início: ele usa ESTA tag, e
         precisa de um PNG quadrado e opaco. `/logo.png` é 172x80 e ficaria esmagado. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, e nao `black-translucent`: com translucent o iOS desenha a pagina POR
         BAIXO do relogio e da bateria em modo aplicativo, e o cabecalho fica escondido
         atras deles. Com `default` o sistema reserva a faixa e nada precisa de calculo
         de safe-area no topo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Orion" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Orion - GMP</title>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para executar este aplicativo.</noscript>
    <div id="root"></div>
  </body>
</html>

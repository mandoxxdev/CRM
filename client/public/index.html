<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <!-- `viewport-fit=cover` e o que faz `env(safe-area-inset-*)` valer no iPhone com
         entalhe: sem ele a barra inferior fica debaixo da barra de gestos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Orion - GMP - Sistema de Gestão da GMP Industriais" />

    <!-- PWA ------------------------------------------------------------------
         theme_color combina com o `background_color` do manifest (#10141D, o mesmo
         navy do ícone): a barra de status e a splash de abertura ficam da mesma cor,
         em vez de piscar azul e depois navy. -->
    <meta name="theme-color" content="#10141D" />
    <link rel="manifest" href="/manifest.json" />

    <!-- A marca nova (vetor, animada) como icone da aba; o PNG fica de reserva para
         navegadores sem suporte a SVG no favicon. -->
    <link rel="icon" type="image/svg+xml" href="/orion-mark.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- O iOS ignora o manifest para o ícone da tela de início: ele usa ESTA tag, e
         precisa de um PNG quadrado e opaco. `/logo.png` é 172x80 e ficaria esmagado. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, e nao `black-translucent`: com translucent o iOS desenha a pagina POR
         BAIXO do relogio e da bateria em modo aplicativo, e o cabecalho fica escondido
         atras deles. Com `default` o sistema reserva a faixa e nada precisa de calculo
         de safe-area no topo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Orion" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter e a fonte do sistema; Caveat e a manuscrita do site da GMP ("a forca esta na
         gravidade"), usada na assinatura "GMP Industriais" sob o catavento. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <title>Orion - GMP</title>
    <!-- Pagina que se recupera sozinha da TROCA DE DEPLOY (24/11/2026).
         A producao roda em conteiner (Coolify) e cada push troca o conteiner. No instante da
         troca, o index.html novo pode vir de um conteiner e o `main.<hash>.js` ser pedido ao
         outro, que nao tem esse arquivo: 404 no bundle principal e TELA BRANCA — foi o que o
         P.O. viu as 22:28, hora exata do deploy. O chunkLoadRecovery.js cuida dos chunks
         preguicosos, mas ele mora dentro do bundle que nao carregou. Este script vive no HTML:
         ouve o erro de carga do main.js/main.css, espera a troca terminar e recarrega (no
         maximo 3 vezes por aba; o app zera o contador quando sobe). -->
    <script>
      (function () {
        var CHAVE = 'orion_boot_reload_count';
        var LIMITE = 3;
        var agendado = false;
        function eBundlePrincipal(el) {
          if (!el || !el.tagName) return false;
          var tag = el.tagName.toUpperCase();
          var url = tag === 'SCRIPT' ? el.src : (tag === 'LINK' ? el.href : '');
          return /\/static\/(js|css)\/main\.[a-f0-9]+\.(js|css)(\?|$)/.test(url || '');
        }
        function contador() {
          try { return parseInt(sessionStorage.getItem(CHAVE) || '0', 10) || 0; } catch (e) { return 0; }
        }
        function avisar() {
          try {
            var raiz = document.getElementById('root');
            if (raiz && !raiz.firstChild) {
              raiz.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
                'font:500 14px/1.4 Inter,-apple-system,Segoe UI,sans-serif;color:#6E6E73;background:#fff">' +
                'Atualizando o sistema…</div>';
            }
          } catch (e) { /* ignore */ }
        }
        window.addEventListener('error', function (e) {
          if (agendado || !eBundlePrincipal(e.target)) return;
          var n = contador();
          if (n >= LIMITE) return; // deixa o erro aparecer no console em vez de recarregar para sempre
          agendado = true;
          try { sessionStorage.setItem(CHAVE, String(n + 1)); } catch (err) { /* ignore */ }
          avisar();
          setTimeout(function () {
            var u = new URL(window.location.href);
            u.searchParams.set('_cb', String(Date.now()));
            window.location.replace(u.origin + u.pathname + u.search + u.hash);
          }, 1800 + n * 1200);
        }, true);
      })();
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para executar este aplicativo.</noscript>
    <div id="root"></div>
  </body>
</html>

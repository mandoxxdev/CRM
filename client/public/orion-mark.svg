<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Orion">
  <!--
    ORION — marca em estilo de icone de aplicativo (Apple).
    Quadrado de cantos continuos (superellipse aproximada), azul do sistema em
    degrade MUITO curto (quase solido), e um glifo geometrico branco: o anel
    inclinado de um agitador em orbita (a GMP faz agitadores industriais) com o
    nucleo e uma estrela — Orion, a constelacao. Nada de brilho, nada de sombra
    interna; a profundidade vem so da curva do anel. Le bem de 24px a 512px.
    O logo original (logo.png) continua no repositorio e na barra lateral.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B8CFF"/>
      <stop offset="1" stop-color="#0062C4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.72"/>
    </linearGradient>
    <clipPath id="squircle">
      <path d="M128 0C27.3 0 0 27.3 0 128s27.3 128 128 128 128-27.3 128-128S228.7 0 128 0z"/>
    </clipPath>
  </defs>

  <!-- fundo: squircle azul -->
  <g clip-path="url(#squircle)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <!-- um unico halo claro no topo, o mesmo gesto do fundo das telas -->
    <ellipse cx="128" cy="-20" rx="150" ry="110" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <!-- anel orbital inclinado (agitador / orbita) -->
  <g transform="rotate(-28 128 128)">
    <ellipse cx="128" cy="128" rx="78" ry="30" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- nucleo -->
  <circle cx="128" cy="128" r="26" fill="#FFFFFF"/>

  <!-- estrela de Orion: um ponto na orbita, a frente do anel -->
  <circle cx="190" cy="92" r="9" fill="#FFFFFF"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Orion">
  <!--
    ORION — marca em estilo de icone de aplicativo (Apple), ANIMADA.
    A constelacao se move: o anel orbital gira devagar (18s) e a estrela
    percorre a orbita (6s). A animacao e SMIL, dentro do proprio arquivo, por
    isso funciona em qualquer <img> sem JavaScript. Movimento lento e continuo,
    sem piscar — o padrao do icone de app "vivo".
    O logo original (logo.png) continua no repositorio.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B8CFF"/>
      <stop offset="1" stop-color="#0062C4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.72"/>
    </linearGradient>
    <clipPath id="squircle">
      <path d="M128 0C27.3 0 0 27.3 0 128s27.3 128 128 128 128-27.3 128-128S228.7 0 128 0z"/>
    </clipPath>
    <!-- a orbita da estrela: a mesma elipse do anel, inclinada igual -->
    <path id="orbita" d="M50 128 a78 30 0 1 0 156 0 a78 30 0 1 0 -156 0" transform="rotate(-28 128 128)"/>
  </defs>

  <!-- fundo: squircle azul com um halo claro no topo -->
  <g clip-path="url(#squircle)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <ellipse cx="128" cy="-20" rx="150" ry="110" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <!-- anel orbital: gira devagar em torno do nucleo -->
  <g transform="rotate(-28 128 128)">
    <g>
      <ellipse cx="128" cy="128" rx="78" ry="30" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- nucleo, com uma respiracao sutil -->
  <circle cx="128" cy="128" r="26" fill="#FFFFFF">
    <animate attributeName="r" values="26;27.5;26" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- estrela de Orion: percorre a orbita -->
  <circle r="9" fill="#FFFFFF">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="0">
      <mpath href="#orbita"/>
    </animateMotion>
  </circle>
</svg>

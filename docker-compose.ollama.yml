# Serviço Ollama para Orion I.A (grátis, local)
# No Coolify: crie um recurso Docker Compose com este arquivo,
# ou rode no VPS: docker compose -f docker-compose.ollama.yml up -d
#
# Depois no CRM, defina:
#   AI_PROVIDER=ollama
#   OLLAMA_BASE_URL=http://ollama:11434   (mesma rede Docker)
#   OLLAMA_MODEL=llama3.2

services:
  ollama:
    image: ollama/ollama:latest
    container_name: gmp-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Em VPS com GPU NVIDIA, descomente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

volumes:
  ollama_data:
